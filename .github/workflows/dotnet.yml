name: Build Quaver Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false
        ref: ${{ github.ref }}

    - name: Initialize Submodules
      run: |
        git submodule init
        git config submodule.Quaver.Server.Client.update none
        git submodule update --recursive || echo "Submodule update failed, continuing..."

    - name: Apply All Patches Automatically
      shell: pwsh
      run: |
        $patchDir = "BuildPatches"
        $targetRoot = "Quaver.Shared"

        Write-Host "Starting Auto-Patcher..."

        if (Test-Path $patchDir) {
            # Get all .cs files in your patches folder
            $patches = Get-ChildItem -Path $patchDir -File -Recurse -Filter "*.cs"

            foreach ($patch in $patches) {
                Write-Host "Searching for location of: $($patch.Name)"

                # Search the game folder for a file with the same name
                $destination = Get-ChildItem -Path $targetRoot -Recurse -Filter $patch.Name -File | Select-Object -First 1

                if ($destination) {
                    Write-Host "Found at: $($destination.FullName)"
                    Write-Host "Overwriting..."
                    Copy-Item -Path $patch.FullName -Destination $destination.FullName -Force
                } else {
                    Write-Host "::warning::Could not find an existing file named $($patch.Name) in the game code. If this is a NEW file, it was skipped."
                }
            }
        } else {
             Write-Host "No BuildPatches folder found. Skipping."
        }
        
        Write-Host "Patching complete."

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Fix Dependencies (Reference Patching)
      shell: pwsh
      run: |
        $proj = "Quaver.Shared/Quaver.Shared.csproj"
        if (Test-Path $proj) {
            $content = Get-Content $proj -Raw
            $content = $content -replace '<ProjectReference Include=".*Quaver\.Server\.Client\.csproj" />', '<Reference Include="Quaver.Server.Client"><HintPath>Quaver.Server.Client.dll</HintPath></Reference>'
            Set-Content $proj $content
        }
        
        dotnet add Quaver.Shared/Quaver.Shared.csproj package TimeAgo

    - name: Restore dependencies
      run: dotnet restore Quaver/Quaver.csproj

    - name: Build and Publish
      run: dotnet publish Quaver/Quaver.csproj -c Release -r win-x64 --no-self-contained -o ./QuaverMod

    - name: Upload Game Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quaver-Modded-Build
        path: ./QuaverMod
