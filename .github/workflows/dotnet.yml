name: Build Quaver Mod

on:
  push:
    branches: [ develop, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false # Don't let GitHub try to do it automatically

    - name: Manual Submodule Setup
      # This initializes git, tells it to IGNORE the private server folder, then downloads the rest
      run: |
        git submodule init
        git config submodule.Quaver.Server.Client.update none
        git submodule update --recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Restore dependencies
      # We target the PROJECT, not the SOLUTION, to avoid looking for missing files
      run: dotnet restore Quaver/Quaver.csproj

    - name: Build and Publish
      run: dotnet publish Quaver/Quaver.csproj -c Release -r win-x64 --no-self-contained -o ./QuaverMod

    - name: Upload Game Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quaver-Video-Mod
        path: ./QuaverMod
