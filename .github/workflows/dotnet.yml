name: Build Quaver Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false
        ref: ${{ github.ref }}

    - name: Initialize Submodules
      run: |
        git submodule init
        git config submodule.Quaver.Server.Client.update none
        git submodule update --recursive || echo "Submodule update failed, continuing..."

    - name: Apply Patches (And Force Fix Logic)
      shell: pwsh
      run: |
        $patchDir = "BuildPatches"
        $targetRoot = "." 
        Write-Host "--- STARTING AUTO-PATCHER ---"

        # 1. Copy the files from BuildPatches
        if (Test-Path $patchDir) {
            $patches = Get-ChildItem -Path $patchDir -File -Recurse -Filter "*.cs"
            foreach ($patch in $patches) {
                $destinations = Get-ChildItem -Path $targetRoot -Recurse -Filter $patch.Name -File | 
                    Where-Object { 
                        $_.FullName -notlike "*$patchDir*" -and 
                        $_.FullName -notlike "*\.git\*" -and 
                        $_.FullName -notlike "*\bin\*" -and 
                        $_.FullName -notlike "*\obj\*" -and
                        $_.FullName -notlike "*\Wobble\*" 
                    }

                if ($destinations) {
                    foreach ($dest in $destinations) {
                        Write-Host "Overwriting: $($dest.FullName)"
                        Copy-Item -Path $patch.FullName -Destination $dest.FullName -Force
                    }
                }
            }
        }

        # 2. EMERGENCY FIX: Manually rewrite the broken logic in SelectionScreen.cs
        # This ensures it works even if the branch/file is wrong.
        $ssPath = "Quaver.Shared/Screens/Selection/SelectionScreen.cs"
        if (Test-Path $ssPath) {
            Write-Host "--- APPLYING EMERGENCY LOGIC FIX TO SELECTIONSCREEN.CS ---"
            $code = Get-Content $ssPath -Raw

            # Replace the old List logic with the new Bool logic using string replacement
            $code = $code.Replace("var newMaps = MapManager.DetectNewMapsets();", "var found = MapManager.DetectNewMapsets();")
            $code = $code.Replace('Logger.Log($"[SmartRefresh] Scan finished. New folders found: {newMaps.Count}", LogLevel.Important, LogType.Runtime);', 'Logger.Log($"[SmartRefresh] Scan finished.", LogLevel.Important, LogType.Runtime);')
            $code = $code.Replace('if (newMaps.Count == 0) { NotificationManager.Show(NotificationLevel.Success, "No new maps found."); return; }', 'if (!found) { NotificationManager.Show(NotificationLevel.Success, "No new maps found."); return; }')
            $code = $code.Replace('NotificationManager.Show(NotificationLevel.Success, $"Found {newMaps.Count} new mapsets! Importing...");', 'NotificationManager.Show(NotificationLevel.Success, "Found new mapsets! Importing...");')
            $code = $code.Replace('Exit(() => new ImportingScreen(newMaps, false));', 'Exit(() => new ImportingScreen(null, true));')

            Set-Content $ssPath $code
            Write-Host "--- LOGIC FIX APPLIED ---"
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Fix Dependencies
      shell: pwsh
      run: |
        $proj = "Quaver.Shared/Quaver.Shared.csproj"
        if (Test-Path $proj) {
            $content = Get-Content $proj -Raw
            $content = $content -replace '<ProjectReference Include=".*Quaver\.Server\.Client\.csproj" />', '<Reference Include="Quaver.Server.Client"><HintPath>Quaver.Server.Client.dll</HintPath></Reference>'
            Set-Content $proj $content
        }
        dotnet add Quaver.Shared/Quaver.Shared.csproj package TimeAgo

    - name: Restore and Build
      run: |
        dotnet clean Quaver/Quaver.csproj
        dotnet restore Quaver/Quaver.csproj
        dotnet publish Quaver/Quaver.csproj -c Release -r win-x64 --no-self-contained -o ./QuaverMod

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Quaver-Smart-Refresh-Mod
        path: ./QuaverMod
