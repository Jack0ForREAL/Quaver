name: Build Quaver Mod

on:
  push:
    branches: [ develop, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false # We will handle submodules manually to skip the broken one

    - name: Checkout submodules (Skip Private Server)
      # This magical line skips the broken component that caused the error
      run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish
      # Compiles the game into a folder called "QuaverMod"
      run: dotnet publish Quaver/Quaver.csproj -c Release -r win-x64 --no-self-contained -o ./QuaverMod

    - name: Upload Game Artifact
      # Zips up that folder and lets you download it
      uses: actions/upload-artifact@v4
      with:
        name: Quaver-Video-Mod
        path: ./QuaverMod
