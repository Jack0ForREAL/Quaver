name: Build Quaver Mod

on:
  push:
    branches: [ develop, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false

    - name: Initialize Submodules (Skip Private)
      run: |
        git submodule init
        git config submodule.Quaver.Server.Client.update none
        git submodule update --recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Fix Dependencies (PowerShell)
      shell: pwsh
      run: |
        # 1. Define the path to the shared project file
        $proj = "Quaver.Shared/Quaver.Shared.csproj"
        
        # 2. Read the file content
        $content = Get-Content $proj -Raw
        
        # 3. SWAP THE LINK: Replace the missing Project Reference with the existing DLL Reference
        # This Regex looks for the line including the Server.Client.csproj and replaces it
        $content = $content -replace '<ProjectReference Include=".*Quaver\.Server\.Client\.csproj" />', '<Reference Include="Quaver.Server.Client"><HintPath>Quaver.Server.Client.dll</HintPath></Reference>'
        
        # 4. Save the fixed file
        Set-Content $proj $content
        
        # 5. Force install the missing TimeAgo library just in case
        dotnet add Quaver.Shared/Quaver.Shared.csproj package TimeAgo

    - name: Restore dependencies
      run: dotnet restore Quaver/Quaver.csproj

    - name: Build and Publish
      run: dotnet publish Quaver/Quaver.csproj -c Release -r win-x64 --no-self-contained -o ./QuaverMod

    - name: Upload Game Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quaver-Video-Mod
        path: ./QuaverMod
