name: Build Quaver Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false # Changed back to FALSE to prevent crash
        ref: ${{ github.ref }}

    - name: Initialize Submodules (Skip Broken Ones)
      run: |
        git submodule init
        # This command stops it from trying to download the broken Server.Client repo
        git config submodule.Quaver.Server.Client.update none
        git submodule update --recursive || echo "Submodule update failed, continuing..."

    - name: Apply All Patches Automatically
      shell: pwsh
      run: |
        $patchDir = "BuildPatches"
        $targetRoot = "." 

        Write-Host "--- STARTING AUTO-PATCHER ---"

        if (Test-Path $patchDir) {
            $patches = Get-ChildItem -Path $patchDir -File -Recurse -Filter "*.cs"
            foreach ($patch in $patches) {
                Write-Host "Searching for: $($patch.Name)"
                
                # Search entire repo for the file (excluding the patch folder itself)
                $destinations = Get-ChildItem -Path $targetRoot -Recurse -Filter $patch.Name -File | Where-Object { $_.FullName -notlike "*$patchDir*" }

                if ($destinations) {
                    foreach ($dest in $destinations) {
                        Write-Host "SUCCESS: Patching $($patch.Name) -> $($dest.FullName)"
                        Copy-Item -Path $patch.FullName -Destination $dest.FullName -Force
                    }
                } else {
                    Write-Host "::error::FAILED: Could not find any file named $($patch.Name) in the repo!"
                }
            }
        } else {
             Write-Host "::error::BuildPatches folder not found!"
        }
        
        Write-Host "--- PATCHING COMPLETE ---"

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Fix Dependencies
      shell: pwsh
      run: |
        $proj = "Quaver.Shared/Quaver.Shared.csproj"
        if (Test-Path $proj) {
            $content = Get-Content $proj -Raw
            $content = $content -replace '<ProjectReference Include=".*Quaver\.Server\.Client\.csproj" />', '<Reference Include="Quaver.Server.Client"><HintPath>Quaver.Server.Client.dll</HintPath></Reference>'
            Set-Content $proj $content
        }
        dotnet add Quaver.Shared/Quaver.Shared.csproj package TimeAgo

    - name: Restore and Build
      run: |
        dotnet restore Quaver/Quaver.csproj
        dotnet publish Quaver/Quaver.csproj -c Release -r win-x64 --no-self-contained -o ./QuaverMod

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Quaver-Smart-Refresh-Mod
        path: ./QuaverMod
