name: Build Quaver Mod

on:
  push:
    branches: [ develop, master, main, mp4-feature ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false
        ref: ${{ github.ref }}

    - name: Initialize Submodules
      run: |
        git submodule init
        git config submodule.Quaver.Server.Client.update none
        git submodule update --recursive || echo "Submodule update failed, continuing..."

    # --- THE FIX: We manually write the working code so Git can't delete it ---
    - name: Force Fix ReplayHelper
      shell: pwsh
      run: |
        $code = @"
        using System;
        using System.IO;
        using System.Text;
        using Quaver.API.Maps;
        using Quaver.API.Replays;
        using Quaver.Shared.Config;
        using Quaver.Shared.Modifiers;
        using Quaver.API.Helpers;
        using Quaver.API.Enums;

        namespace Quaver.Shared.Helpers
        {
            public static class ReplayHelper
            {
                internal static Replay GeneratePerfectReplay(Qua map, string md5)
                {
                    var replay = new Replay(map.Mode, "Autoplay", ModManager.Mods, md5);
                    if (ModeHelper.IsKeyMode(map.Mode))
                        return Replay.GeneratePerfectReplayKeys(replay, map);
                    throw new ArgumentOutOfRangeException();
                }

                public static void ExportReplayToText(Replay replay, string filename = "last_replay_debug.txt")
                {
                    try
                    {
                        var sb = new StringBuilder();
                        sb.AppendLine($"Map: {replay.MapMd5}");
                        foreach (var f in replay.Frames) sb.AppendLine($"{f.Time} | {f.Keys}");
                        
                        var path = Path.Combine(ConfigManager.DataDirectory.Value, "Replays", filename);
                        Directory.CreateDirectory(Path.GetDirectoryName(path));
                        File.WriteAllText(path, sb.ToString());
                    }
                    catch {}
                }
            }
        }
        "@
        Set-Content "Quaver.Shared/Helpers/ReplayHelper.cs" $code

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Fix Dependencies
      shell: pwsh
      run: |
        $proj = "Quaver.Shared/Quaver.Shared.csproj"
        $content = Get-Content $proj -Raw
        $content = $content -replace '<ProjectReference Include=".*Quaver\.Server\.Client\.csproj" />', '<Reference Include="Quaver.Server.Client"><HintPath>Quaver.Server.Client.dll</HintPath></Reference>'
        Set-Content $proj $content
        dotnet add Quaver.Shared/Quaver.Shared.csproj package TimeAgo

    - name: Restore dependencies
      run: dotnet restore Quaver/Quaver.csproj

    - name: Build and Publish
      run: dotnet publish Quaver/Quaver.csproj -c Release -r win-x64 --no-self-contained -o ./QuaverMod

    - name: Upload Game Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quaver-Video-Mod
        path: ./QuaverMod
