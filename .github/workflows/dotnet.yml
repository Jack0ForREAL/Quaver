name: Build Quaver Mod

on:
  push:
    branches: [ develop, master, main, mp4-feature ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false
        ref: ${{ github.ref }}

    - name: Initialize Submodules
      run: |
        git submodule init
        git config submodule.Quaver.Server.Client.update none
        git submodule update --recursive || echo "Submodule update failed, continuing..."

    - name: Apply MP4 Mod & Replay Patches
      shell: pwsh
      run: |
        Write-Host "Force overwriting submodule files with custom Mod Patches..."

        # 1. Overwrite ReplayHelper (Fixes Logger error + Adds Export function)
        if (Test-Path "BuildPatches/ReplayHelper.cs") {
            Copy-Item -Path "BuildPatches/ReplayHelper.cs" -Destination "Quaver.Shared/Helpers/ReplayHelper.cs" -Force
        }
        
        # 2. Overwrite GameplayScreen (Adds the Destroy() hook)
        if (Test-Path "BuildPatches/GameplayScreen.cs") {
            Copy-Item -Path "BuildPatches/GameplayScreen.cs" -Destination "Quaver.Shared/Screens/Gameplay/GameplayScreen.cs" -Force
        }

        # 3. Overwrite GameplayScreenView (Adds MP4 Video Logic)
        if (Test-Path "BuildPatches/GameplayScreenView.cs") {
            Copy-Item -Path "BuildPatches/GameplayScreenView.cs" -Destination "Quaver.Shared/Screens/Gameplay/GameplayScreenView.cs" -Force
        }

        Write-Host "Patches applied successfully."

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Fix Dependencies (Reference Patching)
      shell: pwsh
      run: |
        # Fix the Project Reference to Server.Client
        $proj = "Quaver.Shared/Quaver.Shared.csproj"
        if (Test-Path $proj) {
            $content = Get-Content $proj -Raw
            $content = $content -replace '<ProjectReference Include=".*Quaver\.Server\.Client\.csproj" />', '<Reference Include="Quaver.Server.Client"><HintPath>Quaver.Server.Client.dll</HintPath></Reference>'
            Set-Content $proj $content
        }
        
        # Add TimeAgo package
        dotnet add Quaver.Shared/Quaver.Shared.csproj package TimeAgo

    - name: Restore dependencies
      run: dotnet restore Quaver/Quaver.csproj

    - name: Build and Publish
      run: dotnet publish Quaver/Quaver.csproj -c Release -r win-x64 --no-self-contained -o ./QuaverMod

    - name: Upload Game Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quaver-Video-Mod
        path: ./QuaverMod
